name: お知らせを同期して公開

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - config.json
      - sync_sheet.py
      - .github/workflows/sync.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Google Sheetsからお知らせを同期
        id: sync
        run: python sync_sheet.py
      - name: GitHub Pagesを準備
        if: steps.sync.outputs.skipped != 'true'
        uses: actions/configure-pages@v5
      - name: 公開ファイルをまとめる
        if: steps.sync.outputs.skipped != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 公開
        if: steps.sync.outputs.skipped != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
